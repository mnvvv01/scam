<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Will You Be My Valentine?</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-pink: #ff8fa3;
            --deep-red: #d12e4b;
            --bg-gradient: linear-gradient(135deg, #fff0f3 0%, #ffccd5 100%);
            --glass: rgba(255, 255, 255, 0.4);
            --glass-border: rgba(255, 255, 255, 0.8);
            --shadow: 0 10px 40px rgba(255, 143, 163, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg-gradient);
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Floating Background Hearts */
        .bg-hearts-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        .bg-heart {
            position: absolute;
            bottom: -50px;
            font-size: 24px;
            opacity: 0.6;
            animation: floatUp linear infinite;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }

            20% {
                opacity: 0.6;
            }

            100% {
                transform: translateY(-110vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* Glassmorphism Card */
        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid var(--glass-border);
            border-radius: 24px;
            padding: 50px 30px;
            text-align: center;
            box-shadow: var(--shadow);
            width: 90%;
            max-width: 450px;
            position: relative;
            z-index: 10;
            transition: transform 0.3s ease;
        }

        .glass-card:hover {
            transform: translateY(-5px);
        }

        h1 {
            color: var(--deep-red);
            font-size: 2rem;
            margin-bottom: 40px;
            line-height: 1.3;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            position: relative;
            height: 60px;
        }

        button {
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            font-size: 1.1rem;
            padding: 12px 36px;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            z-index: 2;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .btn-yes {
            background: white;
            color: var(--deep-red);
            border: 2px solid white;
        }

        .btn-yes:hover {
            transform: scale(1.05);
            background: #fff0f3;
            box-shadow: 0 8px 25px rgba(209, 46, 75, 0.2);
        }

        .btn-yes:active {
            transform: scale(0.95);
        }

        .btn-no {
            background: rgba(255, 255, 255, 0.3);
            color: var(--deep-red);
            border: 2px solid rgba(255, 255, 255, 0.5);
        }

        .shy-note {
            margin-top: 25px;
            font-size: 0.8rem;
            color: var(--deep-red);
            opacity: 0.8;
            font-style: italic;
        }

        /* Success Overlay */
        .success-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #ffe0e6 0%, #ffccd5 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.6s ease;
        }

        .success-overlay.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .success-container {
            text-align: center;
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            padding: 20px;
            position: relative;
            z-index: 102;
        }

        .success-container h2 {
            color: var(--deep-red);
            font-size: 2.2rem;
            margin-bottom: 20px;
            text-shadow: 0 2px 10px rgba(255, 255, 255, 0.5);
        }

        .cat-sticker {
            width: 200px;
            margin-bottom: 20px;
            filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.1));
        }

        @keyframes popIn {
            from {
                transform: scale(0.8);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* Explosion Hearts */
        .mini-heart {
            position: absolute;
            pointer-events: none;
            z-index: 99;
            font-size: 20px;
            animation: explode 0.8s ease-out forwards;
        }

        @keyframes explode {
            0% {
                transform: translate(0, 0) scale(0.5);
                opacity: 1;
            }

            100% {
                transform: translate(var(--mx), var(--my)) scale(1.2);
                opacity: 0;
            }
        }
    </style>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
        (function () {
            // REPLACE WITH YOUR PUBLIC KEY
            emailjs.init("cLeHjnYak1jb9PyW7");
        })();
    </script>
</head>

<body>

    <div class="bg-hearts-container" id="bgHearts"></div>

    <div class="glass-card">
       
        <h1>Will you be my Valentine? 💖</h1>
        <div class="btn-group">
            <button class="btn-yes" id="yesBtn">YES</button>
            <button class="btn-no" id="noBtn">NO</button>
        </div>
        <p class="shy-note">"NO" seems a bit shy 😈</p>
    </div>

    <!-- Success Page -->
    <div class="success-overlay" id="successPage">
        <div class="bg-hearts-container" id="successHearts"></div>
        <div class="success-container">
            <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExM2QzM3Z6eWJ6eWJ6eWJ6eWJ6eWJ6eWJ6eWJ6eHM/26FLdmIp6wJr91JAI/giphy.gif"
                alt="Happy Hearts" class="cat-sticker">
            <h2>ohh YAHH!</h2>
            <h2> You just made my Valentine perfect 💕</h2>
        </div>
    </div>

    <script>
        // --- 1. Background Hearts ---
        const bgHearts = document.getElementById('bgHearts');
        const successHearts = document.getElementById('successHearts');
        const heartSymbols = ['💖', '💕', '💗', '💓', '💝', '🌸'];

        function createFloatingHeart(container) {
            const heart = document.createElement('div');
            heart.classList.add('bg-heart');
            heart.innerText = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];

            heart.style.left = Math.random() * 100 + '%';
            heart.style.animationDuration = (Math.random() * 5 + 5) + 's';
            heart.style.fontSize = (Math.random() * 20 + 15) + 'px';
            container.appendChild(heart);

            setTimeout(() => { heart.remove(); }, 10000);
        }

        setInterval(() => createFloatingHeart(bgHearts), 500);

        // --- 2. Button Logic ---
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const successPage = document.getElementById('successPage');

        // Restore Moving "NO" button logic
        function moveNoButton() {
            const width = window.innerWidth;
            const height = window.innerHeight;
            const btnW = noBtn.offsetWidth;
            const btnH = noBtn.offsetHeight;

            // Simple random position
            const newX = Math.random() * (width - btnW - 40) + 20;
            const newY = Math.random() * (height - btnH - 40) + 20;

            noBtn.style.position = 'fixed';
            noBtn.style.left = newX + 'px';
            noBtn.style.top = newY + 'px';
            noBtn.style.zIndex = '100';
        }

        // Add listeners for movement
        noBtn.addEventListener('mouseenter', moveNoButton);
        noBtn.addEventListener('click', moveNoButton);
        noBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            moveNoButton();
        });

        // --- 3. YES Button Interaction ---
        yesBtn.addEventListener('click', (e) => {
            const rect = yesBtn.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            for (let i = 0; i < 30; i++) {
                createMiniHeart(centerX, centerY);
            }

            // EmailJS Notification
            const serviceID = "service_zie2t02";
            const templateID = "template_lun4hip";

            const templateParams = {
                to_name: "My Valentine",
                message: "She said YES! 💖",
                to_email: "manavpatel97236@gmail.com", // This must be mapped in your EmailJS template
            };

            emailjs.send(serviceID, templateID, templateParams)
                .then(() => {
                    console.log('Email sent successfully!');
                }, (err) => {
                    console.log('Failed to send email:', err);
                });

            setTimeout(() => {
                successPage.classList.add('visible');
                setInterval(() => createFloatingHeart(successHearts), 200);
            }, 500);
        });

        function createMiniHeart(x, y) {
            const heart = document.createElement('div');
            heart.innerText = '💗';
            heart.classList.add('mini-heart');
            document.body.appendChild(heart);
            heart.style.left = x + 'px';
            heart.style.top = y + 'px';

            const angle = Math.random() * Math.PI * 2;
            const velocity = Math.random() * 150 + 50;
            const mx = Math.cos(angle) * velocity + 'px';
            const my = Math.sin(angle) * velocity + 'px';

            heart.style.setProperty('--mx', mx);
            heart.style.setProperty('--my', my);

            setTimeout(() => heart.remove(), 1000);
        }

    </script>
</body>

</html>
